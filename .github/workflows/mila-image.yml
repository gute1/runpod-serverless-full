# GitHub Actions workflow for gute1/runpod-serverless-full, at
# .github/workflows/mila-image.yml there. Kept here as the source of truth:
# adding a workflow file through the API needs a token with the "workflow"
# scope, so it is pasted once in the browser.
#
# Builds mila.Dockerfile and pushes ghcr.io/<owner>/mila-runpod. A GitHub
# runner has a fast network and no 30-minute limit, and nothing is uploaded
# from the office. Runs on a change to mila.Dockerfile, or by hand (Actions ›
# Mila RunPod image › Run workflow).
name: Mila RunPod image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [mila.Dockerfile]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The image is ~13GB; a runner starts with ~14GB free. Toolchains this
      # build never uses give back another ~30GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/mila-runpod"
          TAG="${GITHUB_SHA::7}"
          docker build -f mila.Dockerfile -t "$IMG:$TAG" -t "$IMG:latest" .
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
          echo "### Pushed \`$IMG:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
